<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>
<body>

    <h1>Cadastro de Produtos</h1>

    <form th:action="@{/adicionar}" th:object="${novoProduto}" method="post">

        <label>Nome:</label>
        <input type="text" th:field="*{nome}" placeholder="Nome do produto" required />
        <br><br>

        <label>Preço:</label>
        <input type="number" step="0.01" min="0" th:field="*{preco}" placeholder="Preço" required />
        <br><br>

        <label>Categoria:</label>
     <select th:field="*{categoria.id}">
    <option th:value="${null}">Selecione uma categoria</option>
    <option th:each="cat : ${categorias}" 
            th:value="${cat.id}" 
            th:text="${cat.nome}">
    </option>
</select>

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <hr>

    <a th:href="@{/}">⬅ Voltar para a Página Inicial</a>

</body>
</html>
